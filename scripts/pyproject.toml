[project]
name = "eval-driven-development"
version = "0.1.0"
description = "Headless agent eval loop — run scenarios, score with Opik judges"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    # Pin to 2.x — endpoint shapes changed significantly from 1.x (PATCH traces/batch,
    # PUT experiments/items/bulk, feedback_scores embedded on trace, uuid7 required).
    # Bump only after verifying against references/opik-endpoint-cheatsheet.md.
    "opik>=2.0.36",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agent", "cli", "opik_client", "results", "build_dataset", "run_experiment", "inspect_experiment"]

