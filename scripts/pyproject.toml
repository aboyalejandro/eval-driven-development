[project]
name = "eval-driven-development"
version = "0.1.0"
description = "Headless agent eval loop — run scenarios, score with Opik judges"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "opik>=1.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

