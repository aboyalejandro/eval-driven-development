[project]
name = "eval-driven-development"
version = "0.1.0"
description = "Headless agent eval loop — run scenarios, score with Opik judges"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    # Pin to 2.x — endpoint shapes changed significantly from 1.x (PATCH traces/batch,
    # PUT experiments/items/bulk, feedback_scores embedded on trace, uuid7 required).
    # Bump only after verifying against references/opik-endpoint-cheatsheet.md.
    "opik>=2.0.36",
]

# Mode 3B studio optimization — install separately when needed.
# opik-optimizer is NOT in core deps: it pulls in heavy ML deps (litellm, etc.)
# and is only needed for automated prompt optimization (MetaPromptOptimizer).
# Usage: pip install opik-optimizer
#        python _local/run_optimization.py
[project.optional-dependencies]
studio = [
    "opik-optimizer>=3.1.0",
]

[project.scripts]
edd        = "setup.cli:app"
edd-build  = "simulation.build_dataset:app"
edd-run    = "simulation.run_experiment:app"
edd-inspect = "simulation.inspect_experiment:app"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
exclude = [".venv*", "*.venv*"]

